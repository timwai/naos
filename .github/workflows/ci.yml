name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web dependencies
        run: npm install --prefix web --package-lock=false
      - name: Type-check and build web UI
        run: npm run ci --prefix web

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check NFS smoke shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/ci/nfs-real-smoke.sh scripts/ci/nfs-remote-lock-smoke.sh
      - name: Check Windows smoke PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @(
            "scripts/ci/windows-nfs-real-smoke.ps1",
            "scripts/ci/windows-nfs-remote-lock-smoke.ps1",
            "scripts/ci/windows-smb-real-smoke.ps1"
          ) | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_ -Raw))
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Probe macOS native SMB provider
        if: runner.os == 'macOS'
        run: cargo run -p naosd -- doctor-smb > doctor-smb.json
      - run: cargo run -p naosd -- export-openapi > openapi.json


  nfs-system-gss:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GSS and Kerberos test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libkrb5-dev libclang-dev pkg-config krb5-kdc krb5-admin-server
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p naosd --features system-gss --all-targets
      - run: cargo clippy -p naosd --features system-gss --all-targets -- -D warnings
      - run: cargo test -p naos-nfs --features system-gss
      - name: Run real MIT Kerberos GSS smoke
        if: runner.os == 'Linux'
        env:
          NAOS_TEST_KERBEROS_REALM: "1"
        run: cargo test -p naos-nfs --features system-gss --test system_gss_real -- --nocapture


  samba-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Samba test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
      - name: Run real Samba read/write smoke test
        run: sudo bash scripts/ci/samba-real-smoke.sh


  windows-smb-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real Windows SMB read/write smoke test
        shell: powershell
        run: ./scripts/ci/windows-smb-real-smoke.ps1

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check NFS smoke shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/ci/nfs-real-smoke.sh scripts/ci/nfs-remote-lock-smoke.sh
      - name: Check Windows smoke PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @(
            "scripts/ci/windows-nfs-real-smoke.ps1",
            "scripts/ci/windows-nfs-remote-lock-smoke.ps1",
            "scripts/ci/windows-smb-real-smoke.ps1"
          ) | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_ -Raw))
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Probe macOS native SMB provider
        if: runner.os == 'macOS'
        run: cargo run -p naosd -- doctor-smb > doctor-smb.json
      - run: cargo run -p naosd -- export-openapi > openapi.json


  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test Web API session behavior
        working-directory: web
        run: npm test
      - name: Build SPA from generated OpenAPI types
        working-directory: web
        run: npm run build
      - name: Verify embedded SPA asset contract
        run: |
          test -s web/dist/index.html
          test -s web/dist/assets/app.js
          test -s web/dist/assets/app.css
      - name: Test embedded SPA feature
        run: cargo test -p naosd --features embedded-web embedded_web
      - name: Build production single binary
        run: cargo build -p naosd --features embedded-web
      - name: Install Chromium for browser E2E
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser admin lifecycle E2E
        working-directory: web
        run: npm run test:e2e
      - name: Smoke embedded SPA routing
        shell: bash
        run: |
          set -euo pipefail
          export NAOS_LISTEN=127.0.0.1
          export NAOS_PORT=18443
          export NAOS_DATABASE_URL="sqlite://$RUNNER_TEMP/naos-spa-smoke.db?mode=rwc"
          ./target/debug/naosd >"$RUNNER_TEMP/naosd-spa.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18443/" >"$RUNNER_TEMP/root.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/naosd-spa.log"
            exit 1
          fi

          grep -q '<div id="root"></div>' "$RUNNER_TEMP/root.html"
          curl -fsS "http://127.0.0.1:18443/users" >"$RUNNER_TEMP/users.html"
          cmp "$RUNNER_TEMP/root.html" "$RUNNER_TEMP/users.html"
          curl -fsS "http://127.0.0.1:18443/assets/app.js" >/dev/null
          curl -fsS "http://127.0.0.1:18443/assets/app.css" >/dev/null

          status="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:18443/api/v1/not-a-real-route"
          )"
          test "$status" = "404"


  nfs-system-gss:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GSS and Kerberos test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libkrb5-dev libclang-dev pkg-config krb5-kdc krb5-admin-server
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p naosd --features system-gss --all-targets
      - run: cargo clippy -p naosd --features system-gss --all-targets -- -D warnings
      - run: cargo test -p naos-nfs --features system-gss
      - name: Run real MIT Kerberos GSS smoke
        if: runner.os == 'Linux'
        env:
          NAOS_TEST_KERBEROS_REALM: "1"
        run: cargo test -p naos-nfs --features system-gss --test system_gss_real -- --nocapture


  samba-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Samba test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
      - name: Run real Samba read/write smoke test
        run: sudo bash scripts/ci/samba-real-smoke.sh


  windows-smb-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real Windows SMB read/write smoke test
        shell: powershell
        run: ./scripts/ci/windows-smb-real-smoke.ps1

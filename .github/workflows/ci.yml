name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Run Windows naos account + ACL + SMB integration
        if: runner.os == 'Windows'
        run: cargo test -p naos-smb --test windows_credential_real -- --ignored --nocapture
      - run: cargo run -p naosd -- export-openapi > openapi.json


  samba-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Samba test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba smbclient
      - name: Run real Samba read/write smoke test
        run: sudo bash scripts/ci/samba-real-smoke.sh


  windows-smb-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real Windows SMB read/write smoke test
        shell: powershell
        run: ./scripts/ci/windows-smb-real-smoke.ps1

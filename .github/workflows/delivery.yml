name: delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test Web API session behavior
        working-directory: web
        run: npm test
      - name: Generate OpenAPI types and build Web UI
        working-directory: web
        run: npm run build
      - name: Verify embedded Web files
        run: |
          test -s web/dist/index.html
          test -s web/dist/assets/app.js
          test -s web/dist/assets/app.css
      - uses: actions/upload-artifact@v4
        with:
          name: naos-web-assets
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  platform-bundles:
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: naos-web-assets
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary with embedded Web UI
        run: cargo build --release -p naosd --features embedded-web
      - name: Smoke release CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target/release/naosd export-openapi > "${{ runner.temp }}/delivery-openapi.json"
          grep -q '"openapi"' "${{ runner.temp }}/delivery-openapi.json"
      - name: Smoke release CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\target\release\naosd.exe export-openapi | Out-File -Encoding utf8 "${{ runner.temp }}\delivery-openapi.json"
          if ($LASTEXITCODE -ne 0) { throw "OpenAPI export failed" }
          if (!(Select-String -Path "${{ runner.temp }}\delivery-openapi.json" -Pattern '"openapi"' -Quiet)) { throw "OpenAPI missing" }
      - name: Smoke embedded SPA on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export NAOS_LISTEN=127.0.0.1
          export NAOS_PORT=19443
          export NAOS_DATABASE_URL="sqlite://$RUNNER_TEMP/naos-delivery.db?mode=rwc"
          target/release/naosd > "$RUNNER_TEMP/naos-delivery.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:19443/ > "$RUNNER_TEMP/naos-root.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/naos-delivery.log"
            exit 1
          fi
          curl -fsS http://127.0.0.1:19443/files > "$RUNNER_TEMP/naos-files.html"
          cmp "$RUNNER_TEMP/naos-root.html" "$RUNNER_TEMP/naos-files.html"
          curl -fsS http://127.0.0.1:19443/assets/app.js >/dev/null
          curl -fsS http://127.0.0.1:19443/assets/app.css >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:19443/api/v1/not-a-route)" = "404"
      - name: Smoke embedded SPA on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NAOS_LISTEN = "127.0.0.1"
          $env:NAOS_PORT = "19443"
          $env:NAOS_DATABASE_URL = "sqlite://naos-delivery-windows.db?mode=rwc"
          $stdout = Join-Path $env:RUNNER_TEMP "naos-delivery-windows.out"
          $stderr = Join-Path $env:RUNNER_TEMP "naos-delivery-windows.err"
          $server = Start-Process -FilePath ".\\target\\release\\naosd.exe" -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $root = Invoke-WebRequest -Uri "http://127.0.0.1:19443/" -TimeoutSec 2
                if ($root.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Windows embedded SPA did not start"
            }
            $files = Invoke-WebRequest -Uri "http://127.0.0.1:19443/files"
            if ($root.Content -ne $files.Content) { throw "SPA deep-link fallback mismatch" }
            foreach ($asset in @("app.js", "app.css")) {
              $reply = Invoke-WebRequest -Uri "http://127.0.0.1:19443/assets/$asset"
              if ($reply.StatusCode -ne 200) { throw "Asset $asset unavailable" }
            }
            $notFound = Invoke-WebRequest -Uri "http://127.0.0.1:19443/api/v1/not-a-route" -SkipHttpErrorCheck
            if ($notFound.StatusCode -ne 404) { throw "API 404 masked by SPA" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp target/release/naosd package/
          cp docs/DEPLOYMENT.md package/README-DEPLOY.md
          printf 'repository=timwai/naos\ncommit=%s\nplatform=%s\nfeatures=embedded-web\nworkflow_run=%s\n' "$GITHUB_SHA" "${{ runner.os }}-${{ runner.arch }}" "$GITHUB_RUN_ID" > package/BUILD-INFO.txt
          archive="naos-${{ runner.os }}-${{ runner.arch }}.tar.gz"
          tar -czf "dist/$archive" -C package .
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item target/release/naosd.exe package/
          Copy-Item docs/DEPLOYMENT.md package/README-DEPLOY.md
          @("repository=timwai/naos", "commit=$env:GITHUB_SHA", "platform=${{ runner.os }}-${{ runner.arch }}", "features=embedded-web", "workflow_run=$env:GITHUB_RUN_ID") | Set-Content -Encoding ascii package/BUILD-INFO.txt
          $archive = "naos-${{ runner.os }}-${{ runner.arch }}.zip"
          Compress-Archive -Path package/* -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "dist/$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: naos-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

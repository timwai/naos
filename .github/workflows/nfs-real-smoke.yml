name: nfs-real-smoke

on:
  workflow_dispatch:
    inputs:
      remote_nlm_host:
        description: "Separate naos NFS server host for remote NLMv4 validation"
        required: false
        default: ""
        type: string
      remote_nlm_export:
        description: "Remote export path"
        required: false
        default: "/ci-share"
        type: string
      remote_nfs_port:
        description: "Remote NFSv3 TCP port"
        required: false
        default: "2049"
        type: string
      remote_mount_port:
        description: "Remote MOUNTv3 TCP port"
        required: false
        default: "20048"
        type: string
      remote_nlm_restart_target:
        description: "Optional SSH user@host used to restart the remote naosd service during reclaim validation"
        required: false
        default: ""
        type: string
      remote_nlm_restart_service:
        description: "Validated systemd service name to restart on the remote NFS server"
        required: false
        default: "naosd"
        type: string
      remote_nlm_restart_grace_wait:
        description: "Seconds to wait after RPC recovery before checking reclaimed locks (must exceed 30s grace)"
        required: false
        default: "35"
        type: string
  push:
    branches: [main]
    paths:
      - "crates/naos-nfs/**"
      - "crates/naos-core/src/path.rs"
      - "scripts/ci/nfs-real-smoke.sh"
      - "scripts/ci/nfs-remote-lock-smoke.sh"
      - ".github/workflows/nfs-real-smoke.yml"

jobs:
  linux-nfs-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, nfs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NFS smoke server
        run: cargo build -p naos-nfs --example nfs-smoke-server
      - name: Run real Linux NFSv3 mount/read/write smoke test
        env:
          NAOS_NFS_SMOKE_SERVER: ${{ github.workspace }}/target/debug/examples/nfs-smoke-server
        run: sudo env NAOS_NFS_SMOKE_SERVER="$NAOS_NFS_SMOKE_SERVER" bash scripts/ci/nfs-real-smoke.sh

  macos-nfs-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NFS smoke server
        run: cargo build -p naos-nfs --example nfs-smoke-server
      - name: Run real macOS NFSv3 mount/read/write smoke test
        env:
          NAOS_NFS_SMOKE_SERVER: ${{ github.workspace }}/target/debug/examples/nfs-smoke-server
        run: |
          # Remote NLM requires client and server to have distinct rpcbind/lockd state.
          # The hosted runner is a same-host loopback topology, so keep this smoke on nolocks.
          sudo env \
            NAOS_NFS_SMOKE_SERVER="$NAOS_NFS_SMOKE_SERVER" \
            NAOS_NFS_SMOKE_LOCKS=0 \
            bash scripts/ci/nfs-real-smoke.sh

  remote-macos-nlm-client:
    if: github.event_name == 'workflow_dispatch' && inputs.remote_nlm_host != ''
    runs-on: [self-hosted, macos, nfs]
    steps:
      - uses: actions/checkout@v4
      - name: Run remote macOS NLMv4 lock smoke test
        env:
          NAOS_NFS_REMOTE_HOST: ${{ inputs.remote_nlm_host }}
          NAOS_NFS_REMOTE_EXPORT: ${{ inputs.remote_nlm_export }}
          NAOS_NFS_REMOTE_NFS_PORT: ${{ inputs.remote_nfs_port }}
          NAOS_NFS_REMOTE_MOUNT_PORT: ${{ inputs.remote_mount_port }}
          NAOS_NFS_REMOTE_RESTART_TARGET: ${{ inputs.remote_nlm_restart_target }}
          NAOS_NFS_REMOTE_RESTART_SERVICE: ${{ inputs.remote_nlm_restart_service }}
          NAOS_NFS_REMOTE_RESTART_GRACE_WAIT: ${{ inputs.remote_nlm_restart_grace_wait }}
        run: |
          sudo env \
            NAOS_NFS_REMOTE_HOST="$NAOS_NFS_REMOTE_HOST" \
            NAOS_NFS_REMOTE_EXPORT="$NAOS_NFS_REMOTE_EXPORT" \
            HOME="$HOME" \
            SSH_AUTH_SOCK="${SSH_AUTH_SOCK:-}" \
            NAOS_NFS_REMOTE_NFS_PORT="$NAOS_NFS_REMOTE_NFS_PORT" \
            NAOS_NFS_REMOTE_MOUNT_PORT="$NAOS_NFS_REMOTE_MOUNT_PORT" \
            NAOS_NFS_REMOTE_RESTART_TARGET="$NAOS_NFS_REMOTE_RESTART_TARGET" \
            NAOS_NFS_REMOTE_RESTART_SERVICE="$NAOS_NFS_REMOTE_RESTART_SERVICE" \
            NAOS_NFS_REMOTE_RESTART_GRACE_WAIT="$NAOS_NFS_REMOTE_RESTART_GRACE_WAIT" \
            bash scripts/ci/nfs-remote-lock-smoke.sh

  windows-nfs-client:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, nfs]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NFS smoke server
        run: cargo build -p naos-nfs --example nfs-smoke-server
      - name: Run real Windows NFSv3 mount/read/write smoke test
        env:
          NAOS_NFS_SMOKE_SERVER: ${{ github.workspace }}\target\debug\examples\nfs-smoke-server.exe
          NAOS_NFS_SMOKE_RPCBIND: 127.0.0.1:111
        run: .\scripts\ci\windows-nfs-real-smoke.ps1

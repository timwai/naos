[workspace]
members = [
    "crates/naosd",
    "crates/naos-api",
    "crates/naos-contract",
    "crates/naos-core",
    "crates/naos-platform",
    "crates/naos-nfs",
    "crates/naos-smb",
    "crates/naos-store",
    "crates/naos-webdav",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/timwai/naos"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hmac = "0.12"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "sync", "time", "io-util", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
utoipa = { version = "5", features = ["macros"] }
